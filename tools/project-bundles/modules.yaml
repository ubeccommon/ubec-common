global:
  project: "UBEC DAO · Ubuntu Bioregional Economic Commons DAO"
  copyright: "© 2024–2026 Michel Garand · CC BY-SA 4.0 · GNU AGPL v3.0"
  contact: "living-labs@ubec.network"
  server:
    host: "ubec-common"
    ip: "49.13.167.206"
    user: "ubec"
    stack: "Ubuntu · nginx 1.24 · PostgreSQL 16 · FastAPI/uvicorn"
    provider: "Hetzner CPX42"
  monorepo:
    path: "/srv/ubec"                       # /srv/ubec IS a git repo
    remote: "github.com/ubeccommon/ubec-common"
  design_cdn: "design.ubec.network/v1/ (ubec-design-system.css, nav-styles.css, ubec-nav.js)"
  fonts: "Bunny Fonts — DM Serif Display, DM Sans, JetBrains Mono"
  instructions_file: "/srv/ubec/INSTRUCTIONS.md"   # single source of truth (tracked in ubec-common)
  # Global rules — apply to every module; edit here to change everywhere.
  rules:
    - "Reason from facts only. Never guess missing info; if unclear, stop and ask."
    - "Coding is exact. Verify endpoints (/openapi.json) and files (ls/cat) before acting; render templates through the app's Jinja env before deploying."
    - "All code Python unless the service requires otherwise (HTML/CSS/JS, nginx)."
    - "EU-hosted only (Hetzner). No AWS/GCP/Azure/Cloudflare. Cloudflare is banned."
    - "Bunny Fonts only (fonts.bunny.net) — never Google Fonts (GDPR)."
    - "Locked terminology: stewards (not users), regenerative (not sustainable), bioregional (one word), commons."
    - "Copyright/licence: © 2024–2026 Michel Garand · CC BY-SA 4.0 (docs) · GNU AGPL v3.0 (code)."
    - "Deploy scripts run as ubec; only nginx -t / systemctl reload nginx need sudo; nginx writes via sudo tee."
  # Deploy discipline — the deploy-by-pull model used across UBEC.
  deploy_model:
    - "Edit in the source-of-truth working copy → commit → git push."
    - "Deploy to live via git pull on the server, then restart the service."
    - ".env and venv/ are gitignored, so git pull never touches secrets or the venv."
    - "Pattern: author + render-test in a clone → git format-patch → git am in source-of-truth → push → pull to live."
  # Session ritual — start and end of every working session.
  session_ritual:
    - "Start: read the module spec + INSTRUCTIONS.md; verify live state before proposing."
    - "Work: one focused thread per session."
    - "End: update the module spec (current state + open threads) and commit; re-upload the spec to the Project knowledge base."
  truth_hierarchy: "git repo > module spec > conversation. The repo is what runs; the spec is a decision log + navigation aid; the chat is scratch."

